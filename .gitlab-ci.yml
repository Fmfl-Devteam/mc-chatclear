stages:
  - check
  - build

default:
  tags:
    - shared

check:
  stage: check
  script:
    - ./gradlew --no-daemon --console=plain check
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: build/test-results/test/TEST-*.xml
    paths:
      - build/reports/tests/
      - build/reports/checkstyle/

build:
  stage: build
  script:
    - ./gradlew --no-daemon --console=plain build
  artifacts:
    expire_in: 1 week
    paths:
      - build/libs/*.jar
