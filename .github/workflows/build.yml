name: Build and release

on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Determine release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Release tags must use a version such as v1.0.0 or 1.0.0.' >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build and check
        shell: bash
        run: |
          ARGS=()
          if [[ -n "${RELEASE_VERSION:-}" ]]; then
            ARGS+=("-PreleaseVersion=$RELEASE_VERSION")
          fi
          bash ./gradlew --no-daemon --console=plain clean build "${ARGS[@]}"
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/
            build/test-results/test/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: ChatClear
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ChatClear
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/*.jar --clobber
          else
            ARGS=()
            if [[ "$TAG" == *-* ]]; then
              ARGS+=(--prerelease)
            fi
            gh release create "$TAG" release/*.jar --verify-tag --title "ChatClear $TAG" --generate-notes "${ARGS[@]}"
          fi
